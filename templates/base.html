<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Sistema de Registro de Vehículos{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Menú de navegación -->

    {% include "components/navbar.html" %}

    <!-- Encabezado -->
    <header class="container text-center py-4">
        <h1>Sistema de Registro de Vehículos</h1>
        <p class="text-muted">Gestión y control de vehículos del parqueadero</p>
    </header>

    <!-- Contenido de cada página -->
    <main class="container py-3">

        {% block content %}
        {% endblock %}

    </main>

    <!-- Pie de página -->
    {% include "components/footer.html" %}

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript propio -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
